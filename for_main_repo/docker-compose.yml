services:
  db:
    image: postgres:16
    container_name: ifiplatform-db
    environment:
      POSTGRES_DB: ifiplatform
      POSTGRES_USER: ifiplatform_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ifiplatform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifiplatform_user -d ifiplatform"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # The image VS Code starts. devcontainer.json's initializeCommand builds
    # it with plain `docker build` under this same name (see .devcontainer/).
    image: ifiplatform-web:dev
    container_name: ifiplatform-web
    # The site runs as app, not dev. VS Code's terminals still open as dev
    # (remoteUser in devcontainer.json). Why: docs/claude_context/dev_container_users.md
    user: app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Norway's clock, with summer and winter time, in the terminal and on
      # Git commits (the container runs on UTC otherwise). The site keeps
      # settings.py's TIME_ZONE: Django sets its own.
      TZ: Europe/Oslo
      DEBUG: "True"
      DJANGO_SECRET_KEY: "dev-only-insecure-key-do-not-use-in-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      USE_POSTGRES: "True"
      DB_NAME: ifiplatform
      DB_USER: ifiplatform_user
      DB_PASSWORD: devpassword
      DB_HOST: db
      DB_PORT: "5432"
      # Keeps the Claude Code login in the claude-config volume, so it survives rebuilds.
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      # Uploads, in the media volume below, since app can't write to the shared folder.
      MEDIA_ROOT: /srv/media
      # The cache in the database, so both app and dev can use it (settings.py).
      CACHE_IN_DATABASE: "True"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/workspace
      - claude-config:/home/dev/.claude
      - media:/srv/media
    init: true
    # The first start copies uploads made before the media volume existed.
    # chmod/find let dev write there too, also in folders made before that.
    # The loop starts runserver again whenever it stops, so `ifi restart-server`
    # (tools/ifi/) only has to stop it. sleep infinity keeps the
    # container running if a start step fails, so the VS Code terminal
    # still works for fixing the error.
    command: >
      sh -c "if ! ls -A /srv/media | grep -q . && ls -A media 2>/dev/null | grep -q .; then
             echo 'Copying ifiplatform/media into the media volume (once).';
             cp -r media/. /srv/media/;
             fi;
             chmod -R g+w /srv/media 2>/dev/null;
             find /srv/media -type d -exec chmod g+s {} + 2>/dev/null;
             python manage.py migrate &&
             python manage.py createcachetable &&
             python manage.py seed_dev_data &&
             while true; do
             python manage.py runserver 0.0.0.0:8000;
             echo 'The server stopped. Starting it again in 2 seconds.';
             sleep 2;
             done;
             echo 'Start-up failed. Fix the error above, then run: ifi restart-server';
             sleep infinity"

volumes:
  ifiplatform-db-data:
  claude-config:
  media:
