services:
  db:
    image: postgres:16
    container_name: halloween-db
    environment:
      POSTGRES_DB: ifiplatform
      POSTGRES_USER: ifiplatform_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ifiplatform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifiplatform_user -d ifiplatform"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: halloween-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: "dev-only-insecure-key-do-not-use-in-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      # Same sign-up as the Halloween mock site: username and password only.
      OPEN_SIGNUP: "True"
      USE_POSTGRES: "True"
      DB_NAME: ifiplatform
      DB_USER: ifiplatform_user
      DB_PASSWORD: devpassword
      DB_HOST: db
      DB_PORT: "5432"
      # Keeps the Claude Code login in the claude-config volume, so it survives rebuilds.
      CLAUDE_CONFIG_DIR: /home/dev/.claude
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/workspace
      - claude-config:/home/dev/.claude
    init: true
    # The loop starts runserver again whenever it stops, so `restart-server`
    # (Dockerfile.dev) only has to stop it. sleep infinity keeps the
    # container running if a start step fails, so the VS Code terminal
    # still works for fixing the error.
    command: >
      sh -c "python manage.py rename_yourpage_app &&
             python manage.py migrate &&
             python manage.py seed_halloween_data &&
             while true; do
             python manage.py runserver 0.0.0.0:8000;
             echo 'The server stopped. Starting it again in 2 seconds.';
             sleep 2;
             done;
             echo 'Start-up failed. Fix the error above, then run: restart-server';
             sleep infinity"

volumes:
  ifiplatform-db-data:
  claude-config:
