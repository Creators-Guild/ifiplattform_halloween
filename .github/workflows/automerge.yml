name: Auto-merge

# Opt-in per PR: add the "automerge" label, and the PR merges itself as soon
# as CI passes. No label = merge by hand as usual. Remove the label before
# CI finishes to cancel. If you add the label after CI already passed,
# re-run CI or just merge by hand.
#
# Note: merges done by this workflow don't trigger other workflows, so
# trello_sync.yml won't move the closed issue's card to Done.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - run: |
          pr=$(gh pr list --head "$BRANCH" --label automerge --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open PR from $BRANCH with the automerge label -- nothing to do."
            exit 0
          fi
          # --match-head-commit: only merge the exact commit CI just tested.
          gh pr merge "$pr" --merge --delete-branch --match-head-commit "$TESTED_SHA"
