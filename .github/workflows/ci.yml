name: CI

# Tests (on PostgreSQL). Lint (Black and pylint) is off in this repo, see
# the lint job. Runs on every PR to main, when started by hand from the
# Actions tab ("Run workflow", any branch), and from deploy.yml before a
# deploy.
#
# EVENT: for Commit for Candy, CI runs only the quick tests (no slow site
# crawler or seeding tests, see the "slow" tag), in parallel, on Python 3.12
# only, so beginners' PRs and deploys don't wait ~5 minutes. To undo, restore
# the matrix list and the test command (both marked EVENT below).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels that PR's still-running check.
# (Runs started by deploy.yml have no head_ref, so they're never cancelled.)
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DJANGO_SECRET_KEY: dummy-secret-key-for-ci
  DEBUG: "True"

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests run on PostgreSQL 16, the same database as production and Docker.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: ifiplatform
          POSTGRES_USER: ifiplatform_user
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifiplatform_user -d ifiplatform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      USE_POSTGRES: "True"
      DB_NAME: ifiplatform
      DB_USER: ifiplatform_user
      DB_PASSWORD: devpassword
      DB_HOST: localhost
      DB_PORT: "5432"
    strategy:
      matrix:
        # EVENT: was ["3.12", "3.13", "3.14"], every version Django 6 supports.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      # EVENT: was `python ifiplatform/manage.py test` (all tests).
      - run: python ifiplatform/manage.py test --exclude-tag=slow --parallel

  # Black and pylint are off in this event repo, so formatting or a low lint
  # score never blocks a beginner's PR. The real IfiPlatform repo still runs
  # both. The job stays, passing at once, in case branch protection requires
  # a "lint" check: removing it would leave every PR waiting for it forever.
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Black and pylint are turned off in this repo."
