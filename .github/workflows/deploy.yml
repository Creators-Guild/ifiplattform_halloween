name: Deploy

# Deploys main to the Docker server every time something is merged, or when
# started by hand from the Actions tab ("Run workflow"). Guide:
# docs/operations/docker_server.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ci:
        description: "Emergency: deploy without running tests/lint first"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # always() so this still runs when `ci` was skipped via skip_ci.
    if: always() && (inputs.skip_ci || needs.ci.result == 'success')
    runs-on: ubuntu-latest
    # Never two deploys at the same time. A merge during a deploy waits for
    # it instead of cancelling it.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          # deploy.sh pulls the new code itself; see that file for the steps.
          script: |
            set -e
            cd /home/ubuntu/ifiplattform_halloween
            bash deploy/docker/deploy.sh
