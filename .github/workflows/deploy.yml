name: Deploy

# Deploys main to the halloween mock server, started by hand from the
# Actions tab ("Run workflow"). There is no nightly schedule: this server
# is a throwaway mock of production, so it is deployed when someone asks
# for it.
#
# Needs three repo secrets: SERVER_IP, SERVER_USER and SSH_PRIVATE_KEY.
# If the checkout on the server isn't at /home/ubuntu/ifiplattform_halloween,
# set the repo variable DEPLOY_PATH instead of editing this file.
on:
  workflow_dispatch:
    inputs:
      skip_ci:
        description: "Deploy without running tests/lint first"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # always() so this still runs when `ci` was skipped via skip_ci.
    if: always() && (inputs.skip_ci || needs.ci.result == 'success')
    runs-on: ubuntu-latest
    concurrency: deploy  # never two deploys at the same time
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          # Grab the newest deploy.sh before running it; see that file for the steps.
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH || '/home/ubuntu/ifiplattform_halloween' }}"
            git fetch origin main
            git checkout origin/main -- deploy/deploy.sh
            bash deploy/deploy.sh
