name: Files check

# For the Commit for Candy issues: checks that a PR only changes the files its
# issue lists under "### Files to change", so helpers can merge it without
# reading the diff. The issue is the one in the PR's "Closes #N". A red check
# lists the extra files; files the issue lists but the PR doesn't touch are
# only shown, since some issues let you leave one out.
#
# Uses only the GitHub API and never checks out the PR's code.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const linked = (pr.body || '').match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!linked) {
              core.setFailed('No "Closes #<issue number>" in the PR description, so there is no file list to check against.');
              return;
            }
            const number = Number(linked[1]);
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number });

            // The bullet list under "### Files to change", up to the next heading.
            const section = (issue.body || '').split(/^### Files to change.*$/m)[1];
            if (section === undefined) {
              core.summary.addRaw(`Issue #${number} has no "Files to change" list, so nothing to check.`).write();
              return;
            }
            const allowed = [...section.split(/^#{1,6} /m)[0].matchAll(/`([^`\s]+\/[^`\s]+)`/g)].map((m) => m[1]);

            const changed = (await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            })).map((f) => f.filename);

            const extra = changed.filter((f) => !allowed.includes(f));
            const untouched = allowed.filter((f) => !changed.includes(f));

            const rows = [
              [{ data: 'File', header: true }, { data: '', header: true }],
              ...changed.map((f) => [f, extra.includes(f) ? '❌ not in the issue' : '✅']),
              ...untouched.map((f) => [f, '➖ listed, not changed']),
            ];
            await core.summary
              .addHeading(`Files for issue #${number}`, 3)
              .addTable(rows)
              .write();

            if (extra.length) {
              core.setFailed(`Changes files that issue #${number} doesn't list: ${extra.join(', ')}`);
            } else {
              core.info(`Only files from issue #${number}. Safe to merge as far as files go.`);
            }
