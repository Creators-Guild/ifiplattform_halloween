{% load i18n %}
{% with current=request.resolver_match.url_name %}
<nav class="yourpage-nav" aria-label="{% trans 'Event points' %}">
    <a class="yourpage-nav__link{% if current == 'yourpage_main' %} yourpage-nav__link--active{% endif %}" href="{% url 'yourpage_main' %}">{% trans "Commits" %}</a>
    <a class="yourpage-nav__link{% if current == 'yourpage_leaderboard' %} yourpage-nav__link--active{% endif %}" href="{% url 'yourpage_leaderboard' %}">{% trans "Leaderboard" %}</a>
    <a class="yourpage-nav__link{% if current == 'yourpage_issues' or current == 'yourpage_issue_detail' %} yourpage-nav__link--active{% endif %}" href="{% url 'yourpage_issues' %}">{% trans "Issues" %}</a>
</nav>
{% endwith %}
