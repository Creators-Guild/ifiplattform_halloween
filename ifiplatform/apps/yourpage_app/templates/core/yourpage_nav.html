{% load i18n yourpage_tags %}
{% is_helper as helper %}
<div class="yourpage-bar">
{% if helper %}
<form class="yourpage-bar__sync" method="post" action="{% url 'yourpage_sync_now' %}">
    {% csrf_token %}
    <button type="submit" class="yourpage-bar__sync-btn">{% trans "Sync now" %}</button>
</form>
{% endif %}
{% with current=request.resolver_match.url_name %}
<nav class="yourpage-nav" aria-label="{% trans 'Event points' %}">
    <a class="yourpage-nav__link{% if current == 'yourpage_main' %} yourpage-nav__link--active{% endif %}" href="{% url 'yourpage_main' %}"{% if current == 'yourpage_main' %} aria-current="page"{% endif %}>{% trans "My issues" %}</a>
    <a class="yourpage-nav__link{% if current == 'yourpage_leaderboard' %} yourpage-nav__link--active{% endif %}" href="{% url 'yourpage_leaderboard' %}"{% if current == 'yourpage_leaderboard' %} aria-current="page"{% endif %}>{% trans "Leaderboard" %}</a>
    <a class="yourpage-nav__link{% if current == 'yourpage_issues' or current == 'yourpage_issue_detail' %} yourpage-nav__link--active{% endif %}" href="{% url 'yourpage_issues' %}"{% if current == 'yourpage_issues' %} aria-current="page"{% endif %}>{% trans "Issues" %}</a>
</nav>
{% endwith %}
{% my_points %}
</div>
{% include "core/messages.html" %}
