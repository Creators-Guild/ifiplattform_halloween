{% if carousel %}<ul class="issue-list issue-list--carousel" data-carousel-track tabindex="0"{% if label %} aria-label="{{ label }}"{% endif %}>{% else %}<ul class="issue-list">{% endif %}
    {% for issue, sub_issues in groups %}
        <li class="issue-list__item{% if issue.category_slug %} issue-list__item--{{ issue.category_slug }}{% endif %}">
            {% include "core/issue_row.html" %}
            {% if sub_issues %}
                <ul class="issue-list issue-list--sub">
                    {% for issue in sub_issues %}
                        <li class="issue-list__item{% if issue.category_slug %} issue-list__item--{{ issue.category_slug }}{% endif %}">{% include "core/issue_row.html" %}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        </li>
    {% endfor %}
</ul>
