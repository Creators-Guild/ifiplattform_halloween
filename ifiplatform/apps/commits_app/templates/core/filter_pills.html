<div class="issue-filters__row" role="group" aria-label="{{ label }}">
    <span class="issue-filters__label">{{ label }}</span>
    <div class="issue-filters__pills">
        {% for text, url, active, colour in pills %}
            <a class="issue-filters__pill{% if colour %} issue-card--{{ colour }} issue-filters__pill--dot{% endif %}{% if active %} issue-filters__pill--active{% endif %}" href="{{ url }}"{% if active %} aria-current="true"{% endif %}>{{ text }}</a>
        {% endfor %}
    </div>
</div>
