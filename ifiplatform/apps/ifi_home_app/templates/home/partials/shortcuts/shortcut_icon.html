{% load static %}
{% if icon %}
<svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if icon == "info" %}
        <circle cx="12" cy="12" r="9.5"/><path d="M12 16.5v-5.5"/><path d="M12 7.5h.01"/>
    {% elif icon == "news" %}
        <path d="M4 5h12v14H6a2 2 0 0 1-2-2z"/><path d="M16 9h4v8a2 2 0 0 1-2 2h-2"/><path d="M7.5 9h5M7.5 12.5h5M7.5 16h3"/>
    {% elif icon == "unions" %}
        <circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.1A5 5 0 0 1 21.5 19"/>
    {% elif icon == "jobs" %}
        <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 12.5h18"/>
    {% elif icon == "events" %}
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
    {% elif icon == "tools" %}
        {# Wrench path from Lucide (lucide.dev), ISC License, Copyright (c) Lucide Contributors #}
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    {% endif %}
</svg>
{% else %}
<img class="icon" src="{% static 'images/icons/black_menu_icon.png' %}" alt="" width="24" height="24">
{% endif %}
