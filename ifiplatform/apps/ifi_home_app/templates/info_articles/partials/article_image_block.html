{% load i18n l10n wagtailimages_tags article_extras %}
{% image image_value.image width-800 as img %}
{% with style=block_styles|lookup:block_id %}
<figure class="body-image-figure body-image--{{ style.alignment }}{% if style.box.enabled %} block-box{% endif %}{% if can_edit_style %} editable-block{% endif %}"
    {% if can_edit_style %}data-block-id="{{ block_id }}" data-block-type="image" data-alignment="{{ style.alignment }}" data-exclude-from-global-alignment="{{ style.exclude_from_global_alignment|yesno:"true,false" }}" data-width-rem="{{ style.width_rem|unlocalize }}" data-side-padding="{{ style.side_padding|unlocalize }}"
    {% include "info_articles/partials/_block_box_data_attrs.html" with box=style.box %}{% endif %}
    style="width: {{ style.width_rem|unlocalize }}rem; max-width: 100%; {% include "info_articles/partials/_block_box_style.html" with box=style.box side_padding=style.side_padding %}">
    {% if can_edit_style %}<button type="button" class="block-style-trigger" aria-label="{% trans 'Edit block style' %}">&#8942;</button>{% endif %}
    <img class="body-image" src="{{ img.url }}" alt="{{ image_value.alt_text|default:image_value.image.title }}">
    {% if image_value.alt_text or image_value.caption %}
        {% with caption_id=block_id|add:"-caption" title_text_id=block_id|add:"-cap-title" caption_text_id=block_id|add:"-cap-body" %}
        {% with caption_style=block_styles|lookup:caption_id title_text_style=block_styles|lookup:title_text_id caption_text_style=block_styles|lookup:caption_text_id %}
        <figcaption class="{% if caption_style.box.enabled %}block-box{% endif %}{% if can_edit_style %} editable-block{% endif %}"
            {% if can_edit_style %}data-block-id="{{ caption_id }}" data-block-type="image_caption"
            data-side-padding="{{ caption_style.side_padding|unlocalize }}"
            {% include "info_articles/partials/_block_box_data_attrs.html" with box=caption_style.box %}
            {% if image_value.alt_text %}data-title-text-id="{{ title_text_id }}" data-title-alignment="{{ title_text_style.alignment }}" data-title-exclude-from-global-alignment="{{ title_text_style.exclude_from_global_alignment|yesno:"true,false" }}" data-title-font-size="{{ title_text_style.font_size|unlocalize }}" data-title-side-padding="{{ title_text_style.side_padding|unlocalize }}" data-title-text-color="{{ title_text_style.text_color }}" data-title-text-custom-color="{{ title_text_style.text_custom_color }}" data-title-text-shadow-enabled="{{ title_text_style.text_shadow_enabled|yesno:"true,false" }}" data-title-text-shadow-strength="{{ title_text_style.text_shadow_strength|unlocalize }}" data-title-text-shadow-color="{{ title_text_style.text_shadow_color }}" data-title-text-shadow-custom-color="{{ title_text_style.text_shadow_custom_color }}"{% endif %}
            {% if image_value.caption %}data-caption-text-id="{{ caption_text_id }}" data-caption-alignment="{{ caption_text_style.alignment }}" data-caption-exclude-from-global-alignment="{{ caption_text_style.exclude_from_global_alignment|yesno:"true,false" }}" data-caption-font-size="{{ caption_text_style.font_size|unlocalize }}" data-caption-side-padding="{{ caption_text_style.side_padding|unlocalize }}" data-caption-text-color="{{ caption_text_style.text_color }}" data-caption-text-custom-color="{{ caption_text_style.text_custom_color }}" data-caption-text-shadow-enabled="{{ caption_text_style.text_shadow_enabled|yesno:"true,false" }}" data-caption-text-shadow-strength="{{ caption_text_style.text_shadow_strength|unlocalize }}" data-caption-text-shadow-color="{{ caption_text_style.text_shadow_color }}" data-caption-text-shadow-custom-color="{{ caption_text_style.text_shadow_custom_color }}"{% endif %}
            {% endif %}
            style="{% include "info_articles/partials/_block_box_style.html" with box=caption_style.box side_padding=caption_style.side_padding %}">
            {% if can_edit_style %}<button type="button" class="block-style-trigger" aria-label="{% trans 'Edit block style' %}">&#8942;</button>{% endif %}
            {% if image_value.alt_text %}<span class="image-title" {% if can_edit_style %}data-font-size="{{ title_text_style.font_size|unlocalize }}"{% endif %} style="font-size: {{ title_text_style.display_font_size|unlocalize }}rem; text-align: {{ title_text_style.alignment }}; padding-left: {{ title_text_style.side_padding|unlocalize }}rem; padding-right: {{ title_text_style.side_padding|unlocalize }}rem; {% include "info_articles/partials/_text_color_style.html" with text_color=title_text_style.text_color text_custom_color=title_text_style.text_custom_color text_shadow_enabled=title_text_style.text_shadow_enabled text_shadow_offset=title_text_style.text_shadow_offset text_shadow_blur=title_text_style.text_shadow_blur text_shadow_color=title_text_style.text_shadow_color text_shadow_custom_color=title_text_style.text_shadow_custom_color %}">{{ image_value.alt_text }}</span>{% endif %}
            {% if image_value.caption %}<span class="image-caption" {% if can_edit_style %}data-font-size="{{ caption_text_style.font_size|unlocalize }}"{% endif %} style="font-size: {{ caption_text_style.display_font_size|unlocalize }}rem; text-align: {{ caption_text_style.alignment }}; padding-left: {{ caption_text_style.side_padding|unlocalize }}rem; padding-right: {{ caption_text_style.side_padding|unlocalize }}rem; {% include "info_articles/partials/_text_color_style.html" with text_color=caption_text_style.text_color text_custom_color=caption_text_style.text_custom_color text_shadow_enabled=caption_text_style.text_shadow_enabled text_shadow_offset=caption_text_style.text_shadow_offset text_shadow_blur=caption_text_style.text_shadow_blur text_shadow_color=caption_text_style.text_shadow_color text_shadow_custom_color=caption_text_style.text_shadow_custom_color %}">{{ image_value.caption }}</span>{% endif %}
        </figcaption>
        {% endwith %}
        {% endwith %}
    {% endif %}
</figure>
{% endwith %}
