{% load i18n %}
{% if translation_nudge %}
    <div class="translation-nudge" role="status">
        <p class="translation-nudge-text">
            {% if translation_nudge.reason == "missing" %}
                {% trans "The English version of this page is missing." %}
            {% else %}
                {% trans "The English version of this page is out of date." %}
            {% endif %}
        </p>
        <div class="translation-nudge-actions">
            <a class="translation-nudge-button translation-nudge-button--secondary" href="{{ translation_nudge.editor_url }}">{% trans "Open English editor" %}</a>
        </div>
    </div>
{% endif %}
