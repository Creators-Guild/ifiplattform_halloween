{% load i18n %}
<h1>{% trans "Your Decks" %}</h1>

<p>{% trans "Total:" %} {{ decks|length }}</p>

<div class ="deck-grid">
    {% for deck in decks %}
        <div class = "deck">
            <a href="{% url 'deck_detail' deck.pk %}">
            {{ deck.name }} {% trans "by" %} {{ deck.owner }}
            </a>

            <form class = "delete-btn"
                method="post"
                action="{% url 'deck_delete' deck.pk %}"
                style="display:inline;"
                onsubmit="return confirm('{% blocktrans %}Are you sure you want to delete this deck?{% endblocktrans %}');">
                {% csrf_token %}
                <button class= "btn btn-delete" type="submit">{% trans "Delete" %}</button>
            </form>
        </div>
    {% empty %}
        {% trans "No decks found." %}
    {% endfor %}
</div>

<p><a class ="btn create-deck" href="{% url 'deck_create' %}">{% trans "Create New Deck?" %}</a></p>
